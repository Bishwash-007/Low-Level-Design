# ========== APPLICATION CONFIGURATION ==========

# Application
spring.application.name=user-service
server.port=8080
server.servlet.context-path=/api
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ========== DATASOURCE CONFIGURATION ==========

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/user_service
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pooling (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ========== JPA/HIBERNATE CONFIGURATION ==========

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ========== LOGGING CONFIGURATION ==========

# Logging Levels
logging.level.root=INFO
logging.level.com.example=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging Format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Logback Configuration File
logging.config=classpath:logback-spring.xml

# ========== ACTUATOR CONFIGURATION ==========

# Enable actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.enable.jvm=true
management.metrics.enable.process=true

# ========== SECURITY CONFIGURATION ==========

# Security settings (if Spring Security is enabled)
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# ========== REQUEST/RESPONSE CONFIGURATION ==========

# Request size limits
server.tomcat.max-http-post-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Request timeout
server.tomcat.connection-timeout=30000
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# ========== JSON CONFIGURATION ==========

# JSON serialization
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ========== CACHE CONFIGURATION ==========

# Cache configuration (if using caching)
spring.cache.type=simple

# ========== ENVIRONMENT DETECTION ==========

# Profiles
spring.profiles.active=dev

# Environment-specific properties
---
spring.config.activate.on-profile=dev
logging.level.root=DEBUG
spring.jpa.show-sql=true

---
spring.config.activate.on-profile=prod
logging.level.root=WARN
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=20

---
spring.config.activate.on-profile=test
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
